name: WidgetSizeProbe
options:
  bundleIdPrefix: com.example.WidgetSizeProbe
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ProbeApp:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WidgetSizeProbe
        INFOPLIST_KEY_CFBundleDisplayName: Size Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ProbeWidget
  ProbeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WidgetSizeProbe.Widget
        INFOPLIST_KEY_CFBundleDisplayName: Size Probe
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
